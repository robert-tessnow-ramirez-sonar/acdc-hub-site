<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AC/DC Resource Hub</title>
<style>
:root{--bg:#f7f9fc;--surface:#fff;--ink:#14233a;--muted:#53657c;--line:#d7e1ec;--accent:#2563eb;--accent-ink:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1440px;margin:0 auto;padding:28px}.masthead{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:12px 4px 26px}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,45px);letter-spacing:-.04em;line-height:1}.intro{max-width:570px;margin:0;color:var(--muted);font-size:15px;line-height:1.5}.workspace{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 12px 35px rgba(20,35,58,.1)}nav{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);background:#edf3fa}.nav-button{appearance:none;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:14px;font-weight:750;padding:11px 15px}.nav-button:hover{border-color:var(--line);background:var(--surface);color:var(--ink)}.nav-button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}.nav-button:focus-visible{outline:3px solid #5b8cff;outline-offset:2px}.page-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.status{display:inline-flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}iframe{display:block;width:100%;height:calc(100vh - 238px);min-height:640px;border:0;background:var(--surface)}@media(max-width:700px){.shell{padding:14px}.masthead{display:block;padding:12px 2px 20px}.intro{margin-top:14px}nav{overflow-x:auto}.nav-button{white-space:nowrap}iframe{min-height:560px;height:calc(100vh - 236px)}}
</style></head><body><div class="shell"><header class="masthead"><div><p class="eyebrow">Sonar agent-centric development cycle</p><h1>AC/DC Resource Hub</h1></div><p class="intro">A focused workspace for evaluating Cloud capabilities, checking Cloud versus Server requirements, and onboarding Hunter Agent, Vortex, Remediation Agent, and SARA.</p></header><main class="workspace"><nav aria-label="AC/DC resources"><button class="nav-button" type="button" aria-selected="true" data-page="testing-playbook.html" data-label="Testing playbook" data-description="Evaluation steps, prompts, evidence, and scorecards">Testing playbook</button><button class="nav-button" type="button" aria-selected="false" data-page="cloud-server-requirements.html" data-label="Cloud &amp; Server requirements" data-description="Deployment requirements and support triage guidance">Cloud &amp; Server requirements</button><button class="nav-button" type="button" aria-selected="false" data-page="hunter-agent-onboarding.html" data-label="Hunter Agent onboarding" data-description="Eligibility, enablement, first-run safeguards, and triage">Hunter Agent onboarding</button><button class="nav-button" type="button" aria-selected="false" data-page="vortex-onboarding.html" data-label="Vortex onboarding" data-description="Eligibility, install steps, supported agents, and the guide-verify loop">Vortex onboarding</button><button class="nav-button" type="button" aria-selected="false" data-page="remediation-agent-onboarding.html" data-label="Remediation Agent onboarding" data-description="Eligibility, install steps, PR and backlog workflows, and verification loop">Remediation Agent onboarding</button><button class="nav-button" type="button" aria-selected="false" data-page="sara-onboarding.html" data-label="SARA onboarding" data-description="Eight-pillar model, maturity levels, and how to run an assessment">SARA onboarding</button></nav><div class="page-meta"><span class="status"><span class="dot"></span><span id="active-label">Testing playbook</span></span><span id="active-description">Evaluation steps, prompts, evidence, and scorecards</span></div><iframe id="resource-frame" title="Testing playbook" src="testing-playbook.html"></iframe></main></div><script>const frame=document.getElementById('resource-frame'),label=document.getElementById('active-label'),description=document.getElementById('active-description');document.querySelectorAll('.nav-button').forEach(button=>button.addEventListener('click',()=>{frame.src=button.dataset.page;frame.title=button.dataset.label;label.textContent=button.dataset.label;description.textContent=button.dataset.description;document.querySelectorAll('.nav-button').forEach(item=>item.setAttribute('aria-selected',String(item===button)));}));</script></body></html>
